<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Broker Calling Tracker</title>

<!-- Supabase client (free CDN, no build step) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --navy-900:#101a2e;
    --navy-800:#16223c;
    --navy-700:#1e2c4a;
    --navy-600:#2a3c62;
    --slate-500:#5b6b8c;
    --slate-300:#aab4cc;
    --slate-100:#eef1f7;
    --paper:#f6f7fb;
    --white:#ffffff;
    --amber:#e0a439;
    --amber-soft:#fdf3df;
    --green:#3a8f6d;
    --green-soft:#e7f5ef;
    --blue:#3d6fd1;
    --blue-soft:#eaf0fd;
    --red:#c1503f;
    --red-soft:#fbeae7;
    --gray:#8b93a7;
    --gray-soft:#eef0f4;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,26,46,0.06), 0 4px 14px rgba(16,26,46,0.06);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font);
    background:var(--paper);
    color:var(--navy-900);
    -webkit-font-smoothing:antialiased;
  }

  #bct-root{max-width:1180px; margin:0 auto; padding:16px 16px 80px;}

  /* ---------- Top bar ---------- */
  .bct-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px 18px;
    flex-wrap:wrap; gap:10px;
  }
  .bct-title{font-size:20px; font-weight:700; letter-spacing:-0.01em; color:var(--navy-900);}
  .bct-title small{display:block; font-weight:500; font-size:12.5px; color:var(--slate-500); margin-top:2px;}
  .bct-topbar-actions{display:flex; gap:8px; align-items:center;}
  .bct-status-pill{
    font-size:12px; padding:5px 10px; border-radius:20px; display:flex; align-items:center; gap:6px;
    background:var(--gray-soft); color:var(--slate-500); font-weight:600;
  }
  .bct-status-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--gray);}
  .bct-status-pill.ok .dot{background:var(--green);}
  .bct-status-pill.ok{background:var(--green-soft); color:var(--green);}
  .bct-status-pill.bad .dot{background:var(--red);}
  .bct-status-pill.bad{background:var(--red-soft); color:var(--red);}

  /* ---------- Dashboard ---------- */
  .bct-dash{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:18px;
  }
  @media (max-width:820px){ .bct-dash{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:480px){ .bct-dash{grid-template-columns:repeat(2,1fr); gap:8px;} }

  .bct-card{
    background:var(--white);
    border:1px solid #e6e9f2;
    border-radius:var(--radius);
    padding:14px 14px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .bct-card:hover{box-shadow:var(--shadow); border-color:#d7dcec;}
  .bct-card:active{transform:scale(0.98);}
  .bct-card.active{border-color:var(--navy-700); box-shadow:0 0 0 1.5px var(--navy-700) inset;}
  .bct-card .num{font-size:24px; font-weight:700; color:var(--navy-900); line-height:1;}
  .bct-card .lbl{font-size:12px; color:var(--slate-500); margin-top:6px; font-weight:600;}
  .bct-card.accent-amber .num{color:#b3801f;}
  .bct-card.accent-red .num{color:var(--red);}
  .bct-card.accent-green .num{color:var(--green);}
  .bct-card.accent-blue .num{color:var(--blue);}

  /* ---------- Controls row ---------- */
  .bct-controls{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    margin-bottom:14px;
  }
  .bct-search{
    flex:1 1 260px;
    display:flex; align-items:center; gap:8px;
    background:var(--white); border:1px solid #e0e4ee; border-radius:var(--radius);
    padding:9px 12px;
  }
  .bct-search input{
    border:none; outline:none; flex:1; font-size:14px; background:transparent; color:var(--navy-900);
  }
  .bct-filters{display:flex; gap:6px; flex-wrap:wrap;}
  .bct-chip{
    font-size:12.5px; padding:7px 12px; border-radius:20px; border:1px solid #e0e4ee;
    background:var(--white); color:var(--slate-500); cursor:pointer; font-weight:600; white-space:nowrap;
  }
  .bct-chip.active{background:var(--navy-900); color:#fff; border-color:var(--navy-900);}
  .bct-toolbtn{
    font-size:12.5px; padding:8px 12px; border-radius:var(--radius); border:1px solid #e0e4ee;
    background:var(--white); color:var(--navy-900); cursor:pointer; font-weight:600;
  }
  .bct-toolbtn:hover{border-color:var(--navy-600);}

  /* ---------- Broker list ---------- */
  .bct-list{display:flex; flex-direction:column; gap:8px;}
  .bct-row{
    background:var(--white); border:1px solid #e6e9f2; border-radius:var(--radius);
    padding:12px 14px;
    display:grid;
    grid-template-columns:1.6fr 1fr 1fr 1fr auto;
    gap:12px; align-items:center;
  }
  .bct-row.priority{background:var(--amber-soft); border-color:#efd9a0;}
  @media (max-width:900px){
    .bct-row{grid-template-columns:1fr; gap:8px;}
  }

  .bct-cell-main{min-width:0;}
  .bct-company{
    font-weight:700; font-size:14.5px; color:var(--navy-900);
    display:flex; align-items:center; gap:6px; cursor:pointer;
    overflow-wrap:anywhere;
  }
  .bct-company:hover{text-decoration:underline;}
  .bct-star{cursor:pointer; font-size:16px; flex:none; user-select:none;}
  .bct-name{font-size:12.5px; color:var(--slate-500); margin-top:2px;}
  .bct-flag{font-size:10.5px; color:var(--red); background:var(--red-soft); padding:1px 6px; border-radius:8px; margin-left:6px; font-weight:700;}

  .bct-cell-label{font-size:10.5px; color:var(--gray); font-weight:700; text-transform:uppercase; letter-spacing:.03em; display:none;}
  @media (max-width:900px){ .bct-cell-label{display:block; margin-bottom:2px;} }

  .bct-phones{display:flex; flex-direction:column; gap:5px;}
  .bct-phone-row{display:flex; align-items:center; gap:8px;}
  .bct-call-btn{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--green); color:#fff; border:none; border-radius:8px;
    padding:6px 10px; font-size:12.5px; font-weight:700; cursor:pointer; text-decoration:none;
    flex:none;
  }
  .bct-call-btn:hover{filter:brightness(1.06);}
  .bct-phone-num{font-size:12.5px; color:var(--navy-800); font-variant-numeric:tabular-nums;}
  .bct-phone-num.landline{color:var(--gray);}

  .bct-status-select{
    font-size:12.5px; padding:6px 8px; border-radius:8px; border:1px solid #dfe3ee; background:#fff;
    font-weight:600; color:var(--navy-900); width:100%; cursor:pointer;
  }
  .bct-followup-date{
    font-size:12.5px; padding:6px 8px; border-radius:8px; border:1px solid #dfe3ee; width:100%;
  }
  .bct-lastcalled{font-size:12.5px; color:var(--slate-500);}

  .bct-row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .bct-mini-btn{
    font-size:12px; padding:6px 10px; border-radius:8px; border:1px solid #e0e4ee; background:#fff;
    cursor:pointer; font-weight:600; color:var(--navy-800);
  }
  .bct-mini-btn:hover{border-color:var(--navy-600);}

  .bct-empty{
    text-align:center; padding:50px 20px; color:var(--slate-500); font-size:14px;
  }

  /* ---------- Modal ---------- */
  .bct-modal-backdrop{
    position:fixed; inset:0; background:rgba(16,26,46,0.45); display:none;
    align-items:flex-start; justify-content:center; z-index:1000; padding:24px 12px; overflow-y:auto;
  }
  .bct-modal-backdrop.open{display:flex;}
  .bct-modal{
    background:#fff; border-radius:14px; width:100%; max-width:560px; padding:22px;
    box-shadow:0 10px 40px rgba(16,26,46,.25); margin-top:20px;
  }
  .bct-modal h3{margin:0 0 4px; font-size:17px; display:flex; align-items:center; gap:8px;}
  .bct-modal .sub{font-size:12.5px; color:var(--slate-500); margin-bottom:16px;}
  .bct-modal textarea{
    width:100%; min-height:90px; border:1px solid #dfe3ee; border-radius:8px; padding:10px;
    font-family:inherit; font-size:13.5px; resize:vertical;
  }
  .bct-modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .bct-btn{
    padding:9px 16px; border-radius:8px; border:none; font-weight:700; font-size:13px; cursor:pointer;
  }
  .bct-btn-primary{background:var(--navy-900); color:#fff;}
  .bct-btn-secondary{background:var(--gray-soft); color:var(--navy-900);}
  .bct-btn-danger{background:var(--red-soft); color:var(--red);}
  .bct-modal-close{position:absolute; top:16px; right:16px; cursor:pointer; font-size:18px; color:var(--slate-500); background:none; border:none;}
  .bct-modal{position:relative;}

  .bct-history-item{
    border-left:2px solid #e6e9f2; padding:6px 0 6px 14px; margin-bottom:2px; position:relative;
  }
  .bct-history-item::before{
    content:''; position:absolute; left:-5px; top:12px; width:8px; height:8px; border-radius:50%; background:#c7cee0;
  }
  .bct-history-item.call::before{background:var(--green);}
  .bct-history-item.remark::before{background:var(--blue);}
  .bct-history-time{font-size:11px; color:var(--gray); font-weight:600;}
  .bct-history-text{font-size:13.5px; color:var(--navy-900); margin-top:2px;}
  .bct-history-actions{margin-top:4px; display:flex; gap:10px;}
  .bct-history-actions span{font-size:11px; color:var(--slate-500); cursor:pointer; text-decoration:underline;}
  .bct-history-scroll{max-height:320px; overflow-y:auto; padding-right:4px; margin:12px 0;}

  .bct-toast-wrap{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:2000; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .bct-toast{
    background:var(--navy-900); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.2); max-width:90vw;
  }
  .bct-toast.err{background:var(--red);}
  .bct-toast.ok{background:var(--green);}

  .bct-priority-toggle-note{font-size:11.5px; color:var(--gray); margin-top:2px;}

  .bct-loading{text-align:center; padding:60px 0; color:var(--slate-500); font-size:14px;}
</style>
</head>
<body>

<div id="bct-root">
  <div class="bct-topbar">
    <div class="bct-title">
      Broker Calling Tracker
      <small>Call, log, follow up — synced to the cloud</small>
    </div>
    <div class="bct-topbar-actions">
      <div id="bct-conn-status" class="bct-status-pill"><span class="dot"></span><span>Connecting…</span></div>
      <button class="bct-toolbtn" id="bct-export-btn">⬇ Export</button>
      <button class="bct-toolbtn" id="bct-import-btn">⬆ Import</button>
      <input type="file" id="bct-import-file" accept=".json,.csv" style="display:none" />
    </div>
  </div>

  <div class="bct-dash" id="bct-dash"><!-- dashboard cards injected --></div>

  <div class="bct-controls">
    <div class="bct-search">
      <span>🔍</span>
      <input type="text" id="bct-search-input" placeholder="Search brokers, company, or number..." />
    </div>
    <div class="bct-filters" id="bct-filters"><!-- filter chips injected --></div>
  </div>

  <div class="bct-list" id="bct-list">
    <div class="bct-loading">Loading your broker list…</div>
  </div>
</div>

<!-- Detail / History modal -->
<div class="bct-modal-backdrop" id="bct-detail-backdrop">
  <div class="bct-modal">
    <button class="bct-modal-close" data-close>✕</button>
    <h3 id="bct-detail-title"></h3>
    <div class="sub" id="bct-detail-sub"></div>

    <div id="bct-detail-phones" style="margin-bottom:12px;"></div>

    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <div style="flex:1;">
        <div class="bct-cell-label" style="display:block;">Status</div>
        <select class="bct-status-select" id="bct-detail-status"></select>
      </div>
      <div style="flex:1;">
        <div class="bct-cell-label" style="display:block;">Next Follow-up</div>
        <input type="date" class="bct-followup-date" id="bct-detail-followup" />
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
      <strong style="font-size:13.5px;">Call History</strong>
      <button class="bct-mini-btn" id="bct-detail-addremark">+ Add Remark</button>
    </div>
    <div class="bct-history-scroll" id="bct-detail-history"></div>
  </div>
</div>

<!-- Add remark modal -->
<div class="bct-modal-backdrop" id="bct-remark-backdrop">
  <div class="bct-modal">
    <button class="bct-modal-close" data-close>✕</button>
    <h3>📝 Add Remark</h3>
    <div class="sub" id="bct-remark-sub"></div>
    <textarea id="bct-remark-text" placeholder="What did the broker say? e.g. Expecting visit on 18/08."></textarea>
    <div class="bct-modal-actions">
      <button class="bct-btn bct-btn-secondary" data-close>Cancel</button>
      <button class="bct-btn bct-btn-primary" id="bct-remark-save">Save Remark</button>
    </div>
  </div>
</div>

<!-- Edit interaction modal -->
<div class="bct-modal-backdrop" id="bct-edit-backdrop">
  <div class="bct-modal">
    <button class="bct-modal-close" data-close>✕</button>
    <h3>Edit Remark</h3>
    <textarea id="bct-edit-text"></textarea>
    <div class="bct-modal-actions">
      <button class="bct-btn bct-btn-danger" id="bct-edit-delete">Delete</button>
      <button class="bct-btn bct-btn-secondary" data-close>Cancel</button>
      <button class="bct-btn bct-btn-primary" id="bct-edit-save">Save</button>
    </div>
  </div>
</div>

<!-- Import summary modal -->
<div class="bct-modal-backdrop" id="bct-importsummary-backdrop">
  <div class="bct-modal">
    <button class="bct-modal-close" data-close>✕</button>
    <h3>Import Summary</h3>
    <div id="bct-importsummary-body" style="font-size:13.5px; line-height:1.7;"></div>
    <div class="bct-modal-actions">
      <button class="bct-btn bct-btn-primary" data-close>Done</button>
    </div>
  </div>
</div>

<div class="bct-toast-wrap" id="bct-toast-wrap"></div>

<script>
/* ============================================================
   BROKER CALLING TRACKER — app.js
   Vanilla JS + Supabase. No build step, no frameworks.

   SETUP: fill in SUPABASE_URL and SUPABASE_ANON_KEY below after
   you create your Supabase project (see SETUP INSTRUCTIONS doc).
   ============================================================ */

const SUPABASE_URL = "https://kiqpfvkrijvwmhcdqkqv.supabase.co"; // e.g. https://xxxx.supabase.co
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpcXBmdmtyaWp2d21oY2Rxa3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMjUzMjAsImV4cCI6MjEwMjYwMTMyMH0.B3ZKFSY54bQjAZ2FFgjwkRYyXUmZLu59MILx1snZPv0";

let sb = null;
let sbReady = false;
try {
  if (SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sbReady = true;
  }
} catch (e) {
  console.error("Supabase init failed", e);
}

const STATUSES = ["Not Called", "Follow Up", "Requirement Received", "Visit Expected", "Not Interested"];
const STATUS_COLORS = {
  "Not Called": "#8b93a7",
  "Follow Up": "#e0a439",
  "Requirement Received": "#3a8f6d",
  "Visit Expected": "#3d6fd1",
  "Not Interested": "#c1503f"
};

let brokers = [];          // full broker list from DB
let interactionsMap = {};  // broker_id -> [interactions] (loaded lazily per-detail-open, cached)
let currentFilter = "All";
let searchTerm = "";
let activeBrokerId = null; // for modals

// ---------- utils ----------
function esc(s){
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function fmtDateTime(iso){
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("en-IN", {
    timeZone: "Asia/Kolkata",
    day: "2-digit", month: "short", year: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true
  });
}
function fmtDate(iso){
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-IN", { timeZone:"Asia/Kolkata", day:"2-digit", month:"short", year:"numeric" });
}
function todayIST(){
  const now = new Date();
  const ist = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
  const y = ist.getFullYear(), m = String(ist.getMonth()+1).padStart(2,"0"), d = String(ist.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function toast(msg, type){
  const wrap = document.getElementById("bct-toast-wrap");
  const el = document.createElement("div");
  el.className = "bct-toast" + (type ? " " + type : "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 4200);
}

function telHref(number){
  // number is already normalized 10-digit mobile, or a landline digit-string.
  return "tel:+91" + number;
}

// ---------- connection status ----------
function setConnStatus(state, label){
  const el = document.getElementById("bct-conn-status");
  el.className = "bct-status-pill" + (state === "ok" ? " ok" : state === "bad" ? " bad" : "");
  el.innerHTML = `<span class="dot"></span><span>${esc(label)}</span>`;
}

// ---------- data loading ----------
async function loadBrokers(){
  if (!sbReady){
    setConnStatus("bad", "Not connected — edit SUPABASE_URL/KEY in the code");
    document.getElementById("bct-list").innerHTML =
      `<div class="bct-empty">This tracker isn't connected to a database yet.<br>Open this file and fill in SUPABASE_URL and SUPABASE_ANON_KEY at the top of the &lt;script&gt; section, then reload.</div>`;
    return;
  }
  try {
    const { data, error } = await sb.from("brokers").select("*").order("company", { ascending: true });
    if (error) throw error;
    brokers = data || [];
    setConnStatus("ok", "Synced");
    render();
  } catch (e) {
    console.error(e);
    setConnStatus("bad", "Connection failed — check internet");
    toast("Could not load brokers. Check your internet connection and Supabase setup.", "err");
    document.getElementById("bct-list").innerHTML = `<div class="bct-empty">Could not load data. Check your internet connection, then refresh.</div>`;
  }
}

async function loadInteractions(brokerId, force){
  if (interactionsMap[brokerId] && !force) return interactionsMap[brokerId];
  try {
    const { data, error } = await sb
      .from("interactions")
      .select("*")
      .eq("broker_id", brokerId)
      .eq("deleted", false)
      .order("created_at", { ascending: false });
    if (error) throw error;
    interactionsMap[brokerId] = data || [];
    return interactionsMap[brokerId];
  } catch (e) {
    console.error(e);
    toast("Could not load call history. Check your connection.", "err");
    return [];
  }
}

// ---------- dashboard ----------
function computeDashboard(){
  const total = brokers.length;
  const called = brokers.filter(b => b.last_called).length;
  const byStatus = {};
  STATUSES.forEach(s => byStatus[s] = 0);
  brokers.forEach(b => { byStatus[b.status] = (byStatus[b.status]||0) + 1; });
  const priority = brokers.filter(b => b.priority).length;
  const today = todayIST();
  const dueToday = brokers.filter(b => b.status === "Follow Up" && b.next_followup && b.next_followup <= today).length;
  return { total, called, byStatus, priority, dueToday };
}

function renderDashboard(){
  const d = computeDashboard();
  const cards = [
    { key: "All", label: "Total Brokers", num: d.total, accent: "" },
    { key: "__Called", label: "Called", num: d.called, accent: "accent-green" },
    { key: "Not Called", label: "Not Called", num: d.byStatus["Not Called"], accent: "" },
    { key: "Follow Up", label: "Follow Up", num: d.byStatus["Follow Up"], accent: "accent-amber" },
    { key: "Requirement Received", label: "Requirement Received", num: d.byStatus["Requirement Received"], accent: "accent-green" },
    { key: "Visit Expected", label: "Visit Expected", num: d.byStatus["Visit Expected"], accent: "accent-blue" },
    { key: "Not Interested", label: "Not Interested", num: d.byStatus["Not Interested"], accent: "accent-red" },
    { key: "__Priority", label: "⭐ Priority Brokers", num: d.priority, accent: "accent-amber" },
    { key: "__DueToday", label: "🔔 Follow-ups Due Today", num: d.dueToday, accent: "accent-red" }
  ];
  const container = document.getElementById("bct-dash");
  container.innerHTML = cards.map(c => `
    <div class="bct-card ${c.accent} ${currentFilter===c.key?'active':''}" data-dash-key="${esc(c.key)}">
      <div class="num">${c.num}</div>
      <div class="lbl">${esc(c.label)}</div>
    </div>
  `).join("");
  container.querySelectorAll("[data-dash-key]").forEach(el => {
    el.addEventListener("click", () => {
      const key = el.getAttribute("data-dash-key");
      currentFilter = key;
      render();
    });
  });
}

// ---------- filters ----------
function renderFilters(){
  const chips = ["All", "⭐ Priority", ...STATUSES];
  const container = document.getElementById("bct-filters");
  container.innerHTML = chips.map(c => {
    const key = c === "⭐ Priority" ? "__Priority" : c;
    return `<div class="bct-chip ${currentFilter===key?'active':''}" data-filter-key="${esc(key)}">${esc(c)}</div>`;
  }).join("");
  container.querySelectorAll("[data-filter-key]").forEach(el => {
    el.addEventListener("click", () => {
      currentFilter = el.getAttribute("data-filter-key");
      render();
    });
  });
}

// ---------- filtering / search ----------
function getFilteredBrokers(){
  let list = brokers.slice();
  if (currentFilter === "__Priority") list = list.filter(b => b.priority);
  else if (currentFilter === "__Called") list = list.filter(b => b.last_called);
  else if (currentFilter === "__DueToday"){
    const today = todayIST();
    list = list.filter(b => b.status === "Follow Up" && b.next_followup && b.next_followup <= today);
  } else if (STATUSES.includes(currentFilter)){
    list = list.filter(b => b.status === currentFilter);
  }
  if (searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    list = list.filter(b => {
      const nums = (b.contacts||[]).map(c => (c.number||c.raw||"")).join(" ");
      return (b.company||"").toLowerCase().includes(q) ||
             (b.name||"").toLowerCase().includes(q) ||
             nums.toLowerCase().includes(q);
    });
  }
  return list;
}

// ---------- list rendering ----------
function renderList(){
  const list = getFilteredBrokers();
  const container = document.getElementById("bct-list");
  if (list.length === 0){
    container.innerHTML = `<div class="bct-empty">No brokers match this view.</div>`;
    return;
  }
  container.innerHTML = list.map(b => rowHTML(b)).join("");
  attachRowEvents();
}

function rowHTML(b){
  const flagCount = (b.contacts||[]).filter(c => c.flagged).length;
  const phonesHTML = (b.contacts||[]).map(c => {
    const num = c.number || c.raw;
    const isLandline = !!c.is_landline;
    return `
      <div class="bct-phone-row">
        <a class="bct-call-btn" href="${telHref(num)}" data-call data-broker="${b.id}" data-number="${esc(num)}">📞 CALL</a>
        <span class="bct-phone-num ${isLandline?'landline':''}">${esc(num)}${isLandline?' (landline)':''}</span>
      </div>`;
  }).join("");

  const statusOptions = STATUSES.map(s => `<option value="${s}" ${b.status===s?'selected':''}>${s}</option>`).join("");

  return `
  <div class="bct-row ${b.priority?'priority':''}" data-row="${b.id}">
    <div class="bct-cell-main">
      <div class="bct-company" data-open-detail="${b.id}">
        <span class="bct-star" data-toggle-priority="${b.id}">${b.priority ? '⭐' : '☆'}</span>
        <span>${esc(b.company)}</span>
        ${flagCount ? `<span class="bct-flag">${flagCount} flagged</span>` : ''}
      </div>
      ${b.name ? `<div class="bct-name">${esc(b.name)}</div>` : ''}
    </div>

    <div>
      <div class="bct-cell-label">Contact</div>
      <div class="bct-phones">${phonesHTML || '<span style="color:var(--gray); font-size:12.5px;">No number</span>'}</div>
    </div>

    <div>
      <div class="bct-cell-label">Status</div>
      <select class="bct-status-select" data-status-select="${b.id}">${statusOptions}</select>
      ${b.status === 'Follow Up' ? `
        <div style="margin-top:6px;">
          <input type="date" class="bct-followup-date" data-followup-input="${b.id}" value="${b.next_followup || ''}" />
        </div>` : ''}
    </div>

    <div>
      <div class="bct-cell-label">Last Called</div>
      <div class="bct-lastcalled">${b.last_called ? fmtDateTime(b.last_called) : '—'}</div>
    </div>

    <div class="bct-row-actions">
      <button class="bct-mini-btn" data-open-detail="${b.id}">HISTORY</button>
      <button class="bct-mini-btn" data-open-remark="${b.id}">+ REMARK</button>
    </div>
  </div>`;
}

function attachRowEvents(){
  document.querySelectorAll("[data-toggle-priority]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      togglePriority(el.getAttribute("data-toggle-priority"));
    });
  });
  document.querySelectorAll("[data-call]").forEach(el => {
    el.addEventListener("click", () => {
      logCall(el.getAttribute("data-broker"), el.getAttribute("data-number"));
    });
  });
  document.querySelectorAll("[data-status-select]").forEach(el => {
    el.addEventListener("change", () => {
      updateStatus(el.getAttribute("data-status-select"), el.value);
    });
  });
  document.querySelectorAll("[data-followup-input]").forEach(el => {
    el.addEventListener("change", () => {
      updateFollowup(el.getAttribute("data-followup-input"), el.value);
    });
  });
  document.querySelectorAll("[data-open-detail]").forEach(el => {
    el.addEventListener("click", () => openDetail(el.getAttribute("data-open-detail")));
  });
  document.querySelectorAll("[data-open-remark]").forEach(el => {
    el.addEventListener("click", () => openRemarkModal(el.getAttribute("data-open-remark")));
  });
}

function render(){
  renderDashboard();
  renderFilters();
  renderList();
}

// ---------- mutations ----------
async function togglePriority(brokerId){
  const b = brokers.find(x => x.id === brokerId);
  if (!b) return;
  const newVal = !b.priority;
  b.priority = newVal; // optimistic
  render();
  try {
    const { error } = await sb.from("brokers").update({ priority: newVal }).eq("id", brokerId);
    if (error) throw error;
  } catch (e) {
    b.priority = !newVal;
    render();
    toast("Could not update priority. Please check your internet connection.", "err");
  }
}

async function updateStatus(brokerId, newStatus){
  const b = brokers.find(x => x.id === brokerId);
  if (!b) return;
  const prev = b.status;
  b.status = newStatus;
  render();
  try {
    const payload = { status: newStatus };
    if (newStatus !== "Follow Up") payload.next_followup = null;
    const { error } = await sb.from("brokers").update(payload).eq("id", brokerId);
    if (error) throw error;
    if (newStatus !== "Follow Up") b.next_followup = null;
    toast("Status updated.", "ok");
  } catch (e) {
    b.status = prev;
    render();
    toast("Status could not be saved. Please check your internet connection.", "err");
  }
}

async function updateFollowup(brokerId, dateVal){
  const b = brokers.find(x => x.id === brokerId);
  if (!b) return;
  const prev = b.next_followup;
  b.next_followup = dateVal || null;
  render();
  try {
    const { error } = await sb.from("brokers").update({ next_followup: dateVal || null }).eq("id", brokerId);
    if (error) throw error;
    toast("Follow-up date saved.", "ok");
  } catch (e) {
    b.next_followup = prev;
    render();
    toast("Follow-up date could not be saved. Please check your internet connection.", "err");
  }
}

async function logCall(brokerId, number){
  const b = brokers.find(x => x.id === brokerId);
  if (!b) return;
  const now = new Date().toISOString();
  const prevLastCalled = b.last_called;
  b.last_called = now; // optimistic, so UI feels instant even though tel: link is already firing
  render();
  try {
    const { error: e1 } = await sb.from("interactions").insert({
      broker_id: brokerId, type: "call", phone_number: number
    });
    if (e1) throw e1;
    const { error: e2 } = await sb.from("brokers").update({ last_called: now }).eq("id", brokerId);
    if (e2) throw e2;
    delete interactionsMap[brokerId]; // force refresh next time history opens
  } catch (e) {
    b.last_called = prevLastCalled;
    render();
    toast("Call was dialed, but couldn't be logged — check your internet connection.", "err");
  }
}

async function saveRemark(brokerId, text){
  if (!text || !text.trim()) { toast("Please type a remark before saving.", "err"); return false; }
  try {
    const { error } = await sb.from("interactions").insert({
      broker_id: brokerId, type: "remark", remark: text.trim()
    });
    if (error) throw error;
    delete interactionsMap[brokerId];
    toast("Remark saved.", "ok");
    return true;
  } catch (e) {
    toast("Remark could not be saved. Please check your internet connection.", "err");
    return false;
  }
}

async function editInteraction(interactionId, newText){
  try {
    const { error } = await sb.from("interactions")
      .update({ remark: newText, edited_at: new Date().toISOString() })
      .eq("id", interactionId);
    if (error) throw error;
    return true;
  } catch (e) {
    toast("Edit could not be saved. Please check your internet connection.", "err");
    return false;
  }
}

async function deleteInteraction(interactionId){
  try {
    const { error } = await sb.from("interactions")
      .update({ deleted: true })
      .eq("id", interactionId);
    if (error) throw error;
    return true;
  } catch (e) {
    toast("Delete failed. Please check your internet connection.", "err");
    return false;
  }
}

// ---------- Detail modal ----------
async function openDetail(brokerId){
  activeBrokerId = brokerId;
  const b = brokers.find(x => x.id === brokerId);
  if (!b) return;
  document.getElementById("bct-detail-title").innerHTML = `${b.priority?'⭐':''} ${esc(b.company)}`;
  document.getElementById("bct-detail-sub").textContent = b.name ? `Contact: ${b.name}` : '';

  document.getElementById("bct-detail-phones").innerHTML = (b.contacts||[]).map(c => {
    const num = c.number || c.raw;
    return `<div class="bct-phone-row" style="margin-bottom:6px;">
      <a class="bct-call-btn" href="${telHref(num)}" data-call data-broker="${b.id}" data-number="${esc(num)}">📞 Call</a>
      <span class="bct-phone-num">${esc(num)}${c.is_landline?' (landline)':''}</span>
    </div>`;
  }).join("");

  const statusSel = document.getElementById("bct-detail-status");
  statusSel.innerHTML = STATUSES.map(s => `<option value="${s}" ${b.status===s?'selected':''}>${s}</option>`).join("");
  statusSel.onchange = () => updateStatus(b.id, statusSel.value);

  const fu = document.getElementById("bct-detail-followup");
  fu.value = b.next_followup || "";
  fu.onchange = () => updateFollowup(b.id, fu.value);

  document.getElementById("bct-detail-addremark").onclick = () => openRemarkModal(b.id);

  document.getElementById("bct-detail-backdrop").classList.add("open");
  document.getElementById("bct-detail-history").innerHTML = `<div style="padding:20px; text-align:center; color:var(--slate-500); font-size:13px;">Loading history…</div>`;

  const items = await loadInteractions(brokerId, true);
  renderHistory(items);

  // re-bind call buttons inside modal (freshly inserted)
  document.querySelectorAll("#bct-detail-phones [data-call]").forEach(el => {
    el.addEventListener("click", () => logCall(el.getAttribute("data-broker"), el.getAttribute("data-number")));
  });
}

function renderHistory(items){
  const container = document.getElementById("bct-detail-history");
  if (!items.length){
    container.innerHTML = `<div style="padding:16px 0; color:var(--slate-500); font-size:13px;">No activity yet. Log a call or add a remark to get started.</div>`;
    return;
  }
  container.innerHTML = items.map(it => {
    if (it.type === "call"){
      return `<div class="bct-history-item call">
        <div class="bct-history-time">${fmtDateTime(it.created_at)}</div>
        <div class="bct-history-text">📞 Call attempted${it.phone_number ? ' — ' + esc(it.phone_number) : ''}</div>
      </div>`;
    }
    return `<div class="bct-history-item remark">
      <div class="bct-history-time">${fmtDateTime(it.created_at)}${it.edited_at ? ' (edited)' : ''}</div>
      <div class="bct-history-text">📝 ${esc(it.remark)}</div>
      <div class="bct-history-actions">
        <span data-edit-interaction="${it.id}">Edit</span>
        <span data-delete-interaction="${it.id}">Delete</span>
      </div>
    </div>`;
  }).join("");

  container.querySelectorAll("[data-edit-interaction]").forEach(el => {
    el.addEventListener("click", () => openEditModal(el.getAttribute("data-edit-interaction")));
  });
  container.querySelectorAll("[data-delete-interaction]").forEach(el => {
    el.addEventListener("click", () => confirmDeleteInteraction(el.getAttribute("data-delete-interaction")));
  });
}

// ---------- Remark modal ----------
function openRemarkModal(brokerId){
  activeBrokerId = brokerId;
  const b = brokers.find(x => x.id === brokerId);
  document.getElementById("bct-remark-sub").textContent = b ? `for ${b.company}` : '';
  document.getElementById("bct-remark-text").value = "";
  document.getElementById("bct-remark-backdrop").classList.add("open");
  setTimeout(() => document.getElementById("bct-remark-text").focus(), 50);
}

document.getElementById("bct-remark-save").addEventListener("click", async () => {
  const text = document.getElementById("bct-remark-text").value;
  const ok = await saveRemark(activeBrokerId, text);
  if (ok){
    closeAllModals();
    if (document.getElementById("bct-detail-backdrop").classList.contains("open") === false){
      // if detail wasn't open, no history to refresh
    }
    const items = await loadInteractions(activeBrokerId, true);
    if (document.getElementById("bct-detail-title").innerHTML) renderHistory(items);
  }
});

// ---------- Edit modal ----------
let editingInteractionId = null;
function openEditModal(interactionId){
  editingInteractionId = interactionId;
  const items = interactionsMap[activeBrokerId] || [];
  const item = items.find(i => i.id === interactionId);
  document.getElementById("bct-edit-text").value = item ? item.remark : "";
  document.getElementById("bct-edit-backdrop").classList.add("open");
}
document.getElementById("bct-edit-save").addEventListener("click", async () => {
  const text = document.getElementById("bct-edit-text").value;
  if (!text.trim()) { toast("Remark can't be empty.", "err"); return; }
  const ok = await editInteraction(editingInteractionId, text.trim());
  if (ok){
    closeAllModals();
    const items = await loadInteractions(activeBrokerId, true);
    renderHistory(items);
    toast("Remark updated.", "ok");
  }
});
document.getElementById("bct-edit-delete").addEventListener("click", () => {
  confirmDeleteInteraction(editingInteractionId);
});

function confirmDeleteInteraction(interactionId){
  if (!confirm("Are you sure you want to delete this interaction? This cannot be undone.")) return;
  deleteInteraction(interactionId).then(async (ok) => {
    if (ok){
      closeAllModals();
      const items = await loadInteractions(activeBrokerId, true);
      renderHistory(items);
      toast("Interaction deleted.", "ok");
    }
  });
}

// ---------- modal close ----------
function closeAllModals(){
  document.querySelectorAll(".bct-modal-backdrop").forEach(el => el.classList.remove("open"));
}
document.querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", closeAllModals));
document.querySelectorAll(".bct-modal-backdrop").forEach(el => {
  el.addEventListener("click", (e) => { if (e.target === el) closeAllModals(); });
});

// ---------- search ----------
document.getElementById("bct-search-input").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  renderList();
});

// ---------- export ----------
document.getElementById("bct-export-btn").addEventListener("click", async () => {
  try {
    const { data: allInteractions, error } = await sb.from("interactions").select("*").eq("deleted", false);
    if (error) throw error;
    const payload = {
      exported_at: new Date().toISOString(),
      brokers: brokers,
      interactions: allInteractions || []
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `broker-tracker-backup-${todayIST()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Backup downloaded.", "ok");
  } catch (e) {
    toast("Export failed. Please check your internet connection.", "err");
  }
});

// ---------- import (JSON backup or CSV of new brokers) ----------
document.getElementById("bct-import-btn").addEventListener("click", () => {
  document.getElementById("bct-import-file").click();
});
document.getElementById("bct-import-file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  if (file.name.endsWith(".json")){
    await importJSONBackup(text);
  } else if (file.name.endsWith(".csv")){
    await importCSV(text);
  } else {
    toast("Please choose a .json backup or .csv file.", "err");
  }
  e.target.value = "";
});

async function importJSONBackup(text){
  try {
    const data = JSON.parse(text);
    if (!data.brokers) throw new Error("Not a valid backup file");
    let added = 0, skipped = 0;
    const existingNumbers = new Set();
    brokers.forEach(b => (b.contacts||[]).forEach(c => existingNumbers.add(c.number || c.raw)));
    for (const b of data.brokers){
      const nums = (b.contacts||[]).map(c => c.number || c.raw);
      const isDup = nums.some(n => existingNumbers.has(n));
      if (isDup){ skipped++; continue; }
      const { error } = await sb.from("brokers").insert({
        name: b.name, company: b.company, contacts: b.contacts || [],
        priority: !!b.priority, status: b.status || "Not Called", next_followup: b.next_followup || null
      });
      if (!error){ added++; nums.forEach(n => existingNumbers.add(n)); }
    }
    showImportSummary({ imported: data.brokers.length, added, skipped });
    await loadBrokers();
  } catch (e) {
    toast("Import failed: " + e.message, "err");
  }
}

function normalizePhoneForImport(raw){
  const digits = String(raw).replace(/\D/g, "");
  let d = digits;
  if (d.length === 12 && d.startsWith("91")) d = d.slice(2);
  if (d.length === 11 && d.startsWith("0")) d = d.slice(1);
  if (d.length === 10 && /[6-9]/.test(d[0])) return { number: d, flagged: false, is_landline: false };
  return { number: d, flagged: true, is_landline: false };
}

function parseCSV(text){
  // Simple CSV parser handling quoted fields with commas.
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim().length));
}

async function importCSV(text){
  try {
    const rows = parseCSV(text);
    if (!rows.length) throw new Error("Empty file");
    const header = rows[0].map(h => h.trim().toLowerCase());
    const nameIdx = header.indexOf("name");
    const companyIdx = header.indexOf("company");
    const contactIdx = header.indexOf("contact");
    if (companyIdx === -1 || contactIdx === -1) throw new Error("CSV needs Name, Company, Contact columns");

    const existingNumbers = new Set();
    brokers.forEach(b => (b.contacts||[]).forEach(c => existingNumbers.add(c.number || c.raw)));

    let added = 0, skipped = 0;
    for (let i = 1; i < rows.length; i++){
      const r = rows[i];
      const name = nameIdx > -1 ? (r[nameIdx]||"").trim() : "";
      const company = (r[companyIdx]||"").trim();
      const contactRaw = (r[contactIdx]||"").trim();
      if (!company) continue;
      const contacts = contactRaw.split(",").map(c => c.trim()).filter(Boolean).map(c => {
        const norm = normalizePhoneForImport(c);
        return { number: norm.number, raw: c, is_landline: norm.is_landline, flagged: norm.flagged };
      });
      const isDup = contacts.some(c => existingNumbers.has(c.number));
      if (isDup){ skipped++; continue; }
      const { error } = await sb.from("brokers").insert({
        name: name || null, company, contacts, priority: false, status: "Not Called"
      });
      if (!error){ added++; contacts.forEach(c => existingNumbers.add(c.number)); }
      else skipped++;
    }
    showImportSummary({ imported: rows.length - 1, added, skipped });
    await loadBrokers();
  } catch (e) {
    toast("CSV import failed: " + e.message, "err");
  }
}

function showImportSummary({ imported, added, skipped }){
  document.getElementById("bct-importsummary-body").innerHTML = `
    Imported: <strong>${imported}</strong><br>
    Added: <strong>${added}</strong><br>
    Skipped duplicates: <strong>${skipped}</strong>
  `;
  document.getElementById("bct-importsummary-backdrop").classList.add("open");
}

// ---------- boot ----------
loadBrokers();
</script>
